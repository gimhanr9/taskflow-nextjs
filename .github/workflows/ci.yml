name: TaskFlow CI

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: taskflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:root@localhost:5432/taskflow_ci?schema=public"
      JWT_SECRET: "taskflow_ci_jwt_secret_key_32_chars_minimum"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & Push Schema to CI Database
        run: |
          npx prisma generate
          npx prisma db push

      - name: Run ESLint
        run: npm run lint

      - name: Run Automated Integration Tests
        run: npm test

      - name: Run Next.js Production Build
        run: npm run build
